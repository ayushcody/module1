<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection Application</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4">Emotion Detector</h2>
                        <div class="mb-3">
                            <label for="textToAnalyze" class="form-label fw-bold">Enter text to analyze:</label>
                            <textarea class="form-control" id="textToAnalyze" rows="4" placeholder="Type your text here..."></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="button" class="btn btn-primary btn-lg" onclick="RunSentimentAnalysis()">Run Emotion Analysis</button>
                        </div>
                        <div class="mt-4 p-3 bg-white rounded border" id="system_response">
                            <span class="text-muted">Analysis results will appear here...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
